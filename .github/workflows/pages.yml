name: Verify and publish WebSoundEdit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: websoundedit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
  publish:
    name: Verify and deploy Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
      - uses: actions/configure-pages@v5
      - name: Deploy verified static app
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published beta
        env:
          PLAYWRIGHT_BASE_URL: https://djshellshoxxx.github.io/websoundedit/
        run: npx playwright test tests/published.spec.js
      - name: Save Pages deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-evidence
          path: |
            test-results/browser/published-*/
            test-results/browser-results.json
            playwright-report/
            dist/build.json
          retention-days: 30
  release:
    name: Publish wiki and prerelease
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download the verified Pages build
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: verified-pages
      - name: Restore the exact deployed artifact
        run: |
          mkdir -p dist
          tar -xf verified-pages/artifact.tar -C dist
      - name: Package verified web and companion sources
        run: node scripts/package-release.mjs
      - name: Publish and verify the GitHub wiki
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-wiki.mjs > artifacts/wiki-publication.json
      - name: Publish and verify the versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs > artifacts/release.json
      - name: Save wiki and release publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-publication-evidence
          path: |
            artifacts/release.json
            artifacts/wiki-publication.json
            artifacts/SHA256SUMS.txt
            dist/build.json
          retention-days: 30
