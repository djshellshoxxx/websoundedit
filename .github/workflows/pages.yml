name: Verify and publish WebSoundEdit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: websoundedit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install audio verification dependencies
        run: |
          # The regional runner mirror can stall large audio-library downloads.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg audacity xvfb xauth
      - name: Install pinned REAPER for native interchange verification
        run: |
          curl --fail --location --retry 3 -o /tmp/reaper.tar.xz https://www.reaper.fm/files/7.x/reaper786_linux_x86_64.tar.xz
          printf '%s\n' 'c2f9d8616bd1dc6175993b82451e1c6e352c6761e7ae6d72400a3f3dfb03bedb  /tmp/reaper.tar.xz' | sha256sum --check
          mkdir -p /tmp/websoundedit-reaper
          tar -xf /tmp/reaper.tar.xz -C /tmp/websoundedit-reaper --strip-components=1
          echo "REAPER_BIN=/tmp/websoundedit-reaper/REAPER/reaper" >> "$GITHUB_ENV"
      - name: Capture independent native REAPER project grammar
        run: xvfb-run -a node scripts/probe-reaper.mjs test-results/reaper-probe
      - name: Save native REAPER probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-reaper-probe
          path: test-results/reaper-probe/
          retention-days: 14
      - run: npm test
      - run: npm run build
        id: build
      - name: Install Chromium
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Verify native Audacity project exchange
        id: native
        run: xvfb-run -a node scripts/verify-audacity.mjs
      - name: Save native interchange evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-audacity-evidence
          path: test-results/native-audacity/
          retention-days: 14
      - name: Test browser editing and real codec conversion
        # Collect browser results even if native interoperability fails. Either
        # failure still fails this job and prevents the Pages artifact/deploy.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:e2e
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/browser/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified static app
        id: deployment
        uses: actions/deploy-pages@v4
