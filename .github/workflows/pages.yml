name: Verify and publish WebSoundEdit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: websoundedit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
      - uses: actions/configure-pages@v5
      - name: Deploy verified static app
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published beta
        env:
          PLAYWRIGHT_BASE_URL: https://djshellshoxxx.github.io/websoundedit/
        run: npx playwright test tests/published.spec.js
      - name: Package verified web and companion sources
        run: |
          mkdir -p artifacts
          python3 -m zipfile -c artifacts/websoundedit-web-1.0.0-beta.1.zip dist
          git archive --format=tar.gz --output=artifacts/websoundedit-companion-1.0.0-beta.1.tar.gz HEAD
          cp docs/releases/1.0.0-beta.1.md artifacts/RELEASE_NOTES.md
          cd artifacts
          sha256sum websoundedit-* > SHA256SUMS.txt
      - name: Publish and verify the GitHub wiki
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-wiki.mjs > artifacts/wiki-publication.json
      - name: Publish 1.0 beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-release.mjs
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.0-beta.1" > artifacts/release.json
      - name: Save publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-evidence
          path: |
            test-results/browser/published-*/
            artifacts/release.json
            artifacts/wiki-publication.json
            artifacts/SHA256SUMS.txt
            dist/build.json
          retention-days: 30
