name: Verify release candidate
description: Unit, security, fuzz, native DAW and browser gates on the exact checkout
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - id: dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
    - name: Install audio verification dependencies
      id: audio-dependencies
      shell: bash
      run: |
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
        fi
        sudo apt-get -o Acquire::Retries=3 update -qq
        sudo apt-get install -y --no-install-recommends ffmpeg audacity xvfb xauth pulseaudio pulseaudio-utils
    - name: Install pinned native REAPER
      id: reaper-runtime
      shell: bash
      run: |
        curl --fail --location --retry 3 -o /tmp/reaper.tar.xz https://www.reaper.fm/files/7.x/reaper786_linux_x86_64.tar.xz
        printf '%s\n' 'c2f9d8616bd1dc6175993b82451e1c6e352c6761e7ae6d72400a3f3dfb03bedb  /tmp/reaper.tar.xz' | sha256sum --check
        mkdir -p /tmp/websoundedit-reaper
        tar -xf /tmp/reaper.tar.xz -C /tmp/websoundedit-reaper --strip-components=1
        echo 'REAPER_BIN=/tmp/websoundedit-reaper/REAPER/reaper' >> "$GITHUB_ENV"
    - name: Unit and integration tests
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.audio-dependencies.outcome == 'success' }}
      shell: bash
      run: npm test
    - name: Dependency security audit
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      shell: bash
      run: |
        mkdir -p test-results/audits
        npm audit --audit-level=moderate --json > test-results/audits/dependencies.json
    - name: Deterministic API, macro, parser and audio fuzz gates
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.audio-dependencies.outcome == 'success' }}
      shell: bash
      run: npm run test:fuzz
    - name: Record bounded DSP performance
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      shell: bash
      run: node scripts/benchmark-live-dsp.mjs --out=test-results/audits/performance.json
    - name: Build and verify the DOM-free SDK
      id: build
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      shell: bash
      run: npm run build
    - name: Install Chromium, Firefox and WebKit
      id: browsers
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: npx playwright install --with-deps chromium firefox webkit
    - name: Native Audacity open, render, save and reimport
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.audio-dependencies.outcome == 'success' }}
      shell: bash
      run: xvfb-run -a node scripts/verify-audacity.mjs
    - name: Native REAPER open, render, save and reimport
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.audio-dependencies.outcome == 'success' && steps.reaper-runtime.outcome == 'success' }}
      shell: bash
      run: xvfb-run -a node scripts/verify-reaper.mjs test-results/reaper-native
    - name: Start virtual audio output for native browser graphs
      if: ${{ !cancelled() && steps.browsers.outcome == 'success' && steps.audio-dependencies.outcome == 'success' }}
      shell: bash
      run: |
        # Firefox needs a working system audio backend to resume an AudioContext.
        # The virtual device clocks real browser PCM/worklets; it does not test
        # physical sound cards or replace the browser's audio implementation.
        mkdir -p test-results/audio-backend
        pulseaudio --start --exit-idle-time=-1 --log-target="file:$PWD/test-results/audio-backend/pulseaudio.log"
        pactl load-module module-null-sink sink_name=websoundedit_ci format=float32le rate=48000 channels=2
        pactl set-default-sink websoundedit_ci
        echo 'PULSE_SINK=websoundedit_ci' >> "$GITHUB_ENV"
        pactl info | tee test-results/audio-backend/server.txt
        pactl list short sinks | tee test-results/audio-backend/sinks.txt
    - name: Desktop and mobile browser editing, worklets, capture, codecs, accessibility and help screenshots
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browsers.outcome == 'success' }}
      shell: bash
      run: npm run test:e2e
    - name: Save all verification evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: beta-verification-evidence
        path: |
          test-results/
          !test-results/reaper-native/**/profile/**
          playwright-report/
        retention-days: 14
    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist
